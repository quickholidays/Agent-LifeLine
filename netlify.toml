[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SPECIAL_USERNAME,ADMIN_USERNAME,NEXT_PUBLIC_GHL_TOKEN,NEXT_PUBLIC_GHL_LOCATION_ID,GITHUB_OWNER,GITHUB_REPO,GITHUB_PAT,GITHUB_TOKEN,GHL_TOKEN,GHL_LOCATION_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"
