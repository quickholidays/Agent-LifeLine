name: Daily GHL Conversation Sync

on:
  schedule:
    # 3:00 PM UTC is 8:00 PM PKT (Pakistan Standard Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows triggering manually from the GitHub Actions tab with one click!

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run GHL Sync Script
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        run: |
          # Write repository secrets into .env.local for the sync script to load
          echo "GHL_TOKEN=$GHL_TOKEN" > .env.local
          echo "GHL_LOCATION_ID=$GHL_LOCATION_ID" >> .env.local
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" >> .env.local
          echo "GITHUB_OWNER=$GITHUB_OWNER" >> .env.local
          echo "GITHUB_REPO=$GITHUB_REPO" >> .env.local
          node scratch/sync_fresh_today.js
